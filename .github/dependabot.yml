# Keeps ci.yml's action pins and the harness's few crates fresh. Honest
# limit: Dependabot only scans .github/workflows/, so the pins in
# templates/keeler.yml — the workflow shipped to adopters — still need a
# deliberate hand bump when they go stale.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
