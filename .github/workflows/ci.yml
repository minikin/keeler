name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      # The deliverable is shell — shellcheck is its static gate.
      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck install.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `just` because the harness tests drive the shipped Justfile's recipes.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      # The harness tests assert shellcheck behavior — don't rely on the
      # runner image happening to preinstall it.
      - name: Ensure shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
      # The committed lockfile must actually match Cargo.toml — nothing
      # else passes --locked, so this is the freshness gate.
      - name: Lockfile is fresh
        run: cargo metadata --format-version 1 --locked > /dev/null
      # Through `just test`, not bare cargo: the recipe knows this crate has
      # no library target and skips doc tests honestly.
      - name: Test
        run: just test

  # No coverage, CRAP or mutation job here: this repository's crate is the
  # installer's test harness, and those gates would only measure a
  # placeholder — a green that cannot go red. The deliverable (install.sh
  # and the files it ships) is gated by the harness tests above, shellcheck
  # in the lints job, and the end-to-end installer jobs below. Adopters
  # still get every gate via templates/keeler.yml.

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # VERSION is the single source of truth; the marker installed into
      # every project must agree with it, or users cannot tell what they run.
      - name: VERSION matches the marker in .claude/keeler.md
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          marker="$(sed -n 's/^<!-- keeler-version: \(.*\) -->$/\1/p' .claude/keeler.md)"
          echo "VERSION=$version marker=$marker"
          [ -n "$marker" ] || { echo "no keeler-version marker in .claude/keeler.md"; exit 1; }
          [ "$version" = "$marker" ] || { echo "VERSION and the marker disagree"; exit 1; }
      - name: CHANGELOG has an entry for this version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          grep -q "^## \[$version\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $version"; exit 1; }

  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-mutants,cargo-crap,just
      # --no-tools here: the tools are already installed above. The
      # bootstrap path that installs them is covered by the job below.
      - name: Binary project — install and pass the gate
        run: |
          cargo new "$RUNNER_TEMP/bin-project"
          ./install.sh "$RUNNER_TEMP/bin-project" --no-tools
          cd "$RUNNER_TEMP/bin-project" && just dev
      - name: Library project — install, pass the gate, kill the mutants
        run: |
          cargo new --lib "$RUNNER_TEMP/lib-project"
          ./install.sh "$RUNNER_TEMP/lib-project" --no-tools
          # cargo's generated `add` trips pedantic clippy; the installer is
          # under test here, not the stub it lands next to.
          sed -i.bak 's/^pub fn add/#[must_use]\npub fn add/' "$RUNNER_TEMP/lib-project/src/lib.rs"
          rm -f "$RUNNER_TEMP/lib-project/src/lib.rs.bak"
          cd "$RUNNER_TEMP/lib-project" && just dev
      - name: An existing CLAUDE.md survives and the import is not duplicated
        run: |
          cargo new --lib "$RUNNER_TEMP/claude-project"
          printf '# CLAUDE.md\n\nProject-specific rules.\n' > "$RUNNER_TEMP/claude-project/CLAUDE.md"
          ./install.sh "$RUNNER_TEMP/claude-project" --no-tools
          ./install.sh "$RUNNER_TEMP/claude-project" --no-tools
          grep -q 'Project-specific rules.' "$RUNNER_TEMP/claude-project/CLAUDE.md"
          test "$(grep -c '@.claude/keeler.md' "$RUNNER_TEMP/claude-project/CLAUDE.md")" = "1"
          test -f "$RUNNER_TEMP/claude-project/.claude/keeler.md"
      # The rules file is the one file an upgrade replaces. It may not take
      # a project's edits down with it without leaving them recoverable.
      - name: Upgrading the rules keeps the replaced copy as .bak
        run: |
          cargo new --lib "$RUNNER_TEMP/rules-project"
          ./install.sh "$RUNNER_TEMP/rules-project" --no-tools
          rules="$RUNNER_TEMP/rules-project/.claude/keeler.md"
          printf '\n<!-- our team also requires X -->\n' >> "$rules"
          printf '\n# team recipe\n' >> "$RUNNER_TEMP/rules-project/Justfile"
          ./install.sh "$RUNNER_TEMP/rules-project" --no-tools > upgrade.log 2>&1 || {
            cat upgrade.log; exit 1; }
          cat upgrade.log
          grep -q 'our team also requires X' "$rules.bak"
          cmp "$rules" .claude/keeler.md
          test ! -e "$rules.keeler"
          # An ordinary conflict is still reported, and every note names the
          # file it wrote — a nameless one means a mangled bookkeeping list.
          grep -q 'Justfile differs' upgrade.log
          ! grep -qE '·[[:space:]]+differs — wrote' upgrade.log

      # Leaving an existing keeler.yml untouched would strand every project
      # on the workflow it first installed — gate fixes would never arrive.
      - name: An outdated workflow is offered as .keeler, never silently kept
        run: |
          cargo new --lib "$RUNNER_TEMP/upgrade-project"
          ./install.sh "$RUNNER_TEMP/upgrade-project" --no-tools
          workflow="$RUNNER_TEMP/upgrade-project/.github/workflows/keeler.yml"
          printf '\n# hand-edited by the project\n' >> "$workflow"
          ./install.sh "$RUNNER_TEMP/upgrade-project" --no-tools
          test -f "$workflow.keeler"
          cmp "$workflow.keeler" templates/keeler.yml
          grep -q 'hand-edited by the project' "$workflow"

      - name: Re-running the installer changes nothing
        run: |
          cd "$RUNNER_TEMP/lib-project"
          git init -q . && git add -A
          before="$(git status --short | sort)"
          cd - >/dev/null
          ./install.sh "$RUNNER_TEMP/lib-project" --no-tools
          cd "$RUNNER_TEMP/lib-project" && git add -A
          [ "$(git status --short | sort)" = "$before" ] || {
            echo "second run modified the project"; git status --short; exit 1; }

  installer-bootstrap:
    name: Installer bootstrap (installs the tools itself)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # No tools pre-installed on purpose: this exercises the path where the
      # installer has to bring up cargo-binstall and the whole toolchain.
      - name: Install into a fresh project, tools and all
        run: |
          cargo new "$RUNNER_TEMP/bootstrap"
          ./install.sh "$RUNNER_TEMP/bootstrap"
          cd "$RUNNER_TEMP/bootstrap" && just dev

  installer-locked-fallback:
    name: Installer source-compile fallback (binstall --locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache here, deliberately: it caches ~/.cargo/bin, so a
      # second run would restore the compiled nextest, the installer's tool
      # probe would find nothing missing, and the fallback this job exists
      # to prove would never execute again. (The bootstrap job omits the
      # cache for the same reason.)
      #
      # Everything except nextest is pre-installed as a binary: nextest is
      # the tool whose source build once broke without --locked, and
      # compiling the others would prove nothing more.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall,cargo-llvm-cov,cargo-mutants,cargo-crap,just
      - name: Install with the compile strategy forced
        env:
          BINSTALL_STRATEGIES: compile
        run: |
          cargo new "$RUNNER_TEMP/fallback"
          ./install.sh "$RUNNER_TEMP/fallback" | tee install.log
          # Provenance, not just presence: the installer itself must have
          # reported nextest missing and gone through its binstall path —
          # a binary that merely exists on PATH proves nothing.
          grep -q "installing: cargo-nextest" install.log
          cargo nextest --version
