# The test harness for Keeler's deliverable — install.sh and the files it
# ships. There is no library here: tests/ drives the installer as a
# subprocess, and the gates this repository runs measure that suite.
[package]
name = "keeler-harness"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
publish = false

# Two members: this harness, and the repository's own task runner. The
# harness stays the root package so tests/ keeps its place; xtask is where
# the release logic lives now that it is Rust and not shell.
[workspace]
members = ["xtask"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[dependencies]

[dev-dependencies]
proptest = "1"

# cargo-mutants builds each mutant with this profile — no debug info keeps it fast.
[profile.mutants]
inherits = "dev"
debug = 0

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
